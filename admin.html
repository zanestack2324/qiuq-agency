<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qiuQ Admin - Blog Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        .header { background: #111; border-bottom: 1px solid #222; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; color: #b54a1f; }
        .header span { font-size: 0.8rem; color: #666; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #111; border: 1px solid #222; padding: 1.5rem; border-radius: 8px; }
        .stat-card h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: #b54a1f; }
        .toolbar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #b54a1f; color: #fff; }
        .btn-primary:hover { background: #c95a2f; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #999; }
        .btn-outline:hover { border-color: #666; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .blog-list { display: grid; gap: 1rem; }
        .blog-item { background: #111; border: 1px solid #222; border-radius: 8px; padding: 1.5rem; display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; transition: border-color 0.2s; }
        .blog-item:hover { border-color: #444; }
        .blog-meta { display: flex; gap: 1rem; margin-top: 0.5rem; }
        .blog-meta span { font-size: 0.75rem; color: #666; }
        .blog-meta span.category { color: #b54a1f; font-weight: 500; }
        .blog-actions { display: flex; gap: 0.5rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #111; border: 1px solid #333; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 2rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-header h2 { font-size: 1.2rem; color: #fff; }
        .modal-close { background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer; }
        .modal-close:hover { color: #fff; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 0.5rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 0.9rem; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #b54a1f; }
        .form-group textarea { min-height: 200px; resize: vertical; font-family: 'SF Mono', Monaco, monospace; font-size: 0.8rem; line-height: 1.6; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .preview { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
        .preview h3 { font-size: 0.7rem; text-transform: uppercase; color: #666; margin-bottom: 1rem; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: #666; }
        .empty-state p { margin-top: 0.5rem; font-size: 0.9rem; }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .blog-item { grid-template-columns: 1fr; }
            .blog-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>qiuQ Admin</h1>
        <span>Blog Manager v1.0</span>
    </div>
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3>Total Posts</h3>
                <div class="value" id="totalPosts">0</div>
            </div>
            <div class="stat-card">
                <h3>Categories</h3>
                <div class="value" id="totalCategories">0</div>
            </div>
        </div>
        <div class="toolbar">
            <button class="btn btn-primary" onclick="openModal()">+ New Post</button>
            <button class="btn btn-outline" onclick="exportData()">Export JSON</button>
            <button class="btn btn-outline" onclick="importData()">Import JSON</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
        </div>
        <div class="blog-list" id="blogList"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <h3>No blog posts yet</h3>
            <p>Click "New Post" to create your first blog post.</p>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New Post</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="postForm" onsubmit="savePost(event)">
                <input type="hidden" id="postId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="postTitle" required placeholder="Your blog post title">
                    </div>
                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text" id="postSlug" required placeholder="blog/post-slug.html">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description (for SEO)</label>
                    <input type="text" id="postDesc" required placeholder="Brief description for meta tags">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="postCategory">
                            <option value="Guides">Guides</option>
                            <option value="Automation">Automation</option>
                            <option value="E-Commerce">E-Commerce</option>
                            <option value="SaaS">SaaS</option>
                            <option value="Performance">Performance</option>
                            <option value="Design">Design</option>
                            <option value="Mobile">Mobile</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Read Time</label>
                        <input type="text" id="postReadTime" placeholder="e.g. 5 min read">
                    </div>
                </div>
                <div class="form-group">
                    <label>Keywords (comma separated)</label>
                    <input type="text" id="postKeywords" placeholder="keyword1, keyword2, keyword3">
                </div>
                <div class="form-group">
                    <label>Content (HTML)</label>
                    <textarea id="postContent" placeholder="<p>Your blog post content here...</p>"></textarea>
                </div>
                <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="deletePost()" id="deleteBtn" style="display:none;">Delete</button>
                    <button type="submit" class="btn btn-primary">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASS = 'qiuq2026';
        if (sessionStorage.getItem('admin_auth') !== ADMIN_PASS) {
            const pass = prompt('Enter admin password:');
            if (pass !== ADMIN_PASS) { alert('Access denied'); window.location.href = '/'; }
            else sessionStorage.setItem('admin_auth', ADMIN_PASS);
        }
        let posts = JSON.parse(localStorage.getItem('qiuq_blog_posts') || '[]');
        if (posts.length === 0) {
            posts = [
                {"id":"why-every-business-needs-automation","title":"Why Every Business Needs Automation in 2026","description":"Manual processes are costing you money. Learn how business automation saves 20+ hours per week.","keywords":"business automation, workflow automation, CRM automation","slug":"blog/why-every-business-needs-automation.html","category":"Automation","date":"2026-07-01","readTime":"6 min read","content":"<p>Your team spends hours every week on tasks that a computer could do in seconds.</p>"},
                {"id":"how-to-choose-web-development-company","title":"How to Choose a Web Development Company in 2026","description":"Not all web development companies are equal. Here's what to look for.","keywords":"web development company, hire web developer","slug":"blog/how-to-choose-web-development-company.html","category":"Guides","date":"2026-07-05","readTime":"7 min read","content":"<p>Choosing the right web development company can make or break your project.</p>"},
                {"id":"mobile-app-vs-website-which-do-you-need","title":"Mobile App vs Website: Which Do You Actually Need?","description":"Should you build a mobile app or a website? Honest comparison.","keywords":"mobile app vs website, progressive web app","slug":"blog/mobile-app-vs-website-which-do-you-need.html","category":"Guides","date":"2026-07-10","readTime":"6 min read","content":"<p>The most common question we hear: \"Should I build a mobile app or a website?\"</p>"},
                {"id":"ecommerce-conversion-optimization-guide","title":"E-Commerce Conversion Optimization: A Practical Guide","description":"12 proven tactics to double your e-commerce conversion rate.","keywords":"ecommerce conversion rate, increase online sales","slug":"blog/ecommerce-conversion-optimization-guide.html","category":"E-Commerce","date":"2026-07-15","readTime":"7 min read","content":"<p>The average e-commerce conversion rate is 2-3%. Here's how to fix that.</p>"},
                {"id":"saas-mvp-development-guide","title":"Building a SaaS MVP: The Complete Guide for 2026","description":"From idea to funded startup -- everything about building a SaaS MVP.","keywords":"SaaS MVP, MVP development, startup MVP","slug":"blog/saas-mvp-development-guide.html","category":"SaaS","date":"2026-07-20","readTime":"10 min read","content":"<p>Every successful SaaS company started with an MVP.</p>"},
                {"id":"web-performance-core-web-vitals-guide","title":"Core Web Vitals: How to Score 90+ on Google PageSpeed","description":"Speed matters for SEO. Here's how we optimize for Core Web Vitals.","keywords":"Core Web Vitals, Google PageSpeed, website speed","slug":"blog/web-performance-core-web-vitals-guide.html","category":"Performance","date":"2026-07-25","readTime":"7 min read","content":"<p>Google uses Core Web Vitals as a ranking factor.</p>"}
            ];
            localStorage.setItem('qiuq_blog_posts', JSON.stringify(posts));
        }
        renderList();

        function renderList() {
            const list = document.getElementById('blogList');
            const empty = document.getElementById('emptyState');
            if (posts.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; }
            empty.style.display = 'none';
            list.innerHTML = posts.map(p => `
                <div class="blog-item">
                    <div>
                        <h3 style="font-size:1rem;color:#fff;">${p.title}</h3>
                        <div class="blog-meta">
                            <span class="category">${p.category}</span>
                            <span>${p.date}</span>
                            <span>${p.readTime}</span>
                        </div>
                    </div>
                    <div class="blog-actions">
                        <button class="btn btn-outline" onclick="editPost('${p.id}')">Edit</button>
                        <button class="btn btn-danger" onclick="deleteById('${p.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('totalPosts').textContent = posts.length;
            const cats = [...new Set(posts.map(p => p.category))];
            document.getElementById('totalCategories').textContent = cats.length;
        }

        function openModal(id) {
            document.getElementById('modal').classList.add('active');
            document.getElementById('postForm').reset();
            document.getElementById('postId').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('modalTitle').textContent = 'New Post';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function editPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;
            document.getElementById('modal').classList.add('active');
            document.getElementById('modalTitle').textContent = 'Edit Post';
            document.getElementById('postId').value = post.id;
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postSlug').value = post.slug;
            document.getElementById('postDesc').value = post.description;
            document.getElementById('postCategory').value = post.category;
            document.getElementById('postReadTime').value = post.readTime;
            document.getElementById('postKeywords').value = post.keywords;
            document.getElementById('postContent').value = post.content;
            document.getElementById('deleteBtn').style.display = 'inline-flex';
        }

        function savePost(e) {
            e.preventDefault();
            const id = document.getElementById('postId').value || Date.now().toString(36);
            const post = {
                id,
                title: document.getElementById('postTitle').value,
                slug: document.getElementById('postSlug').value,
                description: document.getElementById('postDesc').value,
                category: document.getElementById('postCategory').value,
                readTime: document.getElementById('postReadTime').value || '5 min read',
                keywords: document.getElementById('postKeywords').value,
                content: document.getElementById('postContent').value,
                date: new Date().toISOString().slice(0, 10)
            };
            const idx = posts.findIndex(p => p.id === id);
            if (idx >= 0) posts[idx] = post; else posts.push(post);
            localStorage.setItem('qiuq_blog_posts', JSON.stringify(posts));
            renderList();
            closeModal();
        }

        function deletePost() {
            const id = document.getElementById('postId').value;
            if (confirm('Delete this post?')) {
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('qiuq_blog_posts', JSON.stringify(posts));
                renderList();
                closeModal();
            }
        }

        function deleteById(id) {
            if (confirm('Delete this post?')) {
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('qiuq_blog_posts', JSON.stringify(posts));
                renderList();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({posts}, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'blog.json'; a.click();
        }

        function importData() {
            document.getElementById('importFile').click();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.posts) posts = data.posts;
                    localStorage.setItem('qiuq_blog_posts', JSON.stringify(posts));
                    renderList();
                    alert('Imported ' + posts.length + ' posts');
                } catch(err) { alert('Invalid JSON file'); }
            };
            reader.readAsText(file);
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
